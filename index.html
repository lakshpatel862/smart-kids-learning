<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Kids Learning</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🌈 SMART KIDS 🌈</h1>
        <p>👋 Hello! Let's Learn & Play!</p>
        <div class="stars">⭐ Stars: <span id="stars">0</span></div>
    </header>

    <main>

        <div class="menu">

            <button onclick="openPage('abc')">
                🔤
                <span>ABC Learning</span>
            </button>

            <button onclick="openPage('numbers')">
                🔢
                <span>Numbers</span>
            </button>

            <button onclick="openPage('colors')">
                🎨
                <span>Colors & Shapes</span>
            </button>

            <button onclick="openPage('animals')">
                🐶
                <span>Animals</span>
            </button>

            <button onclick="openPage('quiz')">
                🧠
                <span>Quiz Game</span>
            </button>

        </div>


        <!-- ABC PAGE -->
        <section id="abc" class="page">

            <h2>🔤 ABC Learning</h2>

            <div id="alphabetBox" class="cards"></div>

            <button class="back" onclick="goHome()">🏠 Home</button>

        </section>


        <!-- NUMBERS PAGE -->
        <section id="numbers" class="page">

            <h2>🔢 Numbers 1 - 100</h2>

            <div id="numberBox" class="numberCards"></div>

            <button class="back" onclick="goHome()">🏠 Home</button>

        </section>


        <!-- COLORS PAGE -->
        <section id="colors" class="page">

            <h2>🎨 Colors & Shapes</h2>

            <div class="colorCards">

                <div class="color red" onclick="speak('Red')">
                    🔴<br>Red
                </div>

                <div class="color blue" onclick="speak('Blue')">
                    🔵<br>Blue
                </div>

                <div class="color green" onclick="speak('Green')">
                    🟢<br>Green
                </div>

                <div class="color yellow" onclick="speak('Yellow')">
                    🟡<br>Yellow
                </div>

                <div class="shape" onclick="speak('Circle')">
                    ⚪<br>Circle
                </div>

                <div class="shape" onclick="speak('Square')">
                    🟦<br>Square
                </div>

                <div class="shape" onclick="speak('Triangle')">
                    🔺<br>Triangle
                </div>

            </div>

            <button class="back" onclick="goHome()">🏠 Home</button>

        </section>


        <!-- ANIMALS PAGE -->
        <section id="animals" class="page">

            <h2>🐶 Animals</h2>

            <div class="animalCards">

                <div onclick="speak('Dog')">
                    🐶
                    <b>Dog</b>
                </div>

                <div onclick="speak('Cat')">
                    🐱
                    <b>Cat</b>
                </div>

                <div onclick="speak('Lion')">
                    🦁
                    <b>Lion</b>
                </div>

                <div onclick="speak('Elephant')">
                    🐘
                    <b>Elephant</b>
                </div>

                <div onclick="speak('Monkey')">
                    🐒
                    <b>Monkey</b>
                </div>

                <div onclick="speak('Tiger')">
                    🐯
                    <b>Tiger</b>
                </div>

                <div onclick="speak('Rabbit')">
                    🐰
                    <b>Rabbit</b>
                </div>

                <div onclick="speak('Cow')">
                    🐮
                    <b>Cow</b>
                </div>

            </div>

            <button class="back" onclick="goHome()">🏠 Home</button>

        </section>


        <!-- QUIZ PAGE -->
        <section id="quiz" class="page">

            <h2>🧠 Quiz Game</h2>

            <div class="quizBox">

                <h3 id="question">Question</h3>

                <div id="answers"></div>

                <p id="quizResult"></p>

                <button onclick="nextQuestion()">
                    ➡️ Next Question
                </button>

            </div>

            <button class="back" onclick="goHome()">🏠 Home</button>

        </section>

    </main>

    <footer>
        🌟 Learn • Play • Enjoy 🌟
    </footer>

    <script src="script.js"></script>

</body>
</html>
