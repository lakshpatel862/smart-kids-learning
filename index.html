<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Learning World</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HOME -->
<div id="homePage" class="screen">

    <div class="clouds">☁️ ☁️ ☁️</div>

    <div class="homeContent">

        <div class="kids">👧 🧒 👦</div>

        <h1>🌈 Kids Learning World 🌈</h1>
        <p>Learn • Play • Enjoy</p>

        <button class="homeBox alphabetBox" onclick="openAlphabetPage()">
            <span class="homeIcon">🔤</span>
            <span class="homeTitle">Alphabet</span>
            <span class="homeSub">A to Z</span>
            <span class="clickText">👆 Click to Start</span>
        </button>

        <button class="homeBox numberBox" onclick="openNumberPage()">
            <span class="homeIcon">🔢</span>
            <span class="homeTitle">Numbers</span>
            <span class="homeSub">1 to 1000</span>
            <span class="clickText">👆 Click to Start</span>
        </button>

        <button class="homeBox testBox" onclick="openTestMenu()">
            <span class="homeIcon">📝</span>
            <span class="homeTitle">Tests</span>
            <span class="homeSub">20 Marks</span>
            <span class="clickText">👆 Start Test</span>
        </button>

    </div>
</div>


<!-- ALPHABET -->
<div id="alphabetPage" class="screen hidden">

    <button class="homeButton" onclick="goHome()">🏠 Home</button>

    <h1 class="pageTitle">🔤 Learn Alphabet</h1>

    <div class="learningArea">

        <div id="letter" class="letter">A</div>

        <div class="wordArea">
            <div id="picture" class="picture">🍎</div>
            <div id="word" class="word">Apple</div>
        </div>

    </div>

    <div id="sentence" class="sentence">A for Apple</div>

    <button class="speakButton" onclick="speakAlphabet()">
        🔊 Hear Again
    </button>

    <div class="navigation">
        <button onclick="previousAlphabet()">◀ Previous</button>
        <span id="alphabetProgress">A / Z</span>
        <button onclick="nextAlphabet()">Next ▶</button>
    </div>

</div>


<!-- NUMBERS -->
<div id="numberPage" class="screen hidden">

    <button class="homeButton" onclick="goHome()">🏠 Home</button>

    <h1 class="pageTitle">🔢 Learn Numbers</h1>

    <div class="numberLearningArea">

        <div id="bigNumber" class="bigNumber">1</div>

        <div id="balls" class="balls">⚽</div>

        <div id="numberName" class="numberName">One</div>

    </div>

    <button class="speakButton" onclick="speakNumber()">
        🔊 Hear Again
    </button>

    <div class="navigation">
        <button onclick="previousNumber()">◀ Previous</button>
        <span id="numberProgress">1 / 1000</span>
        <button onclick="nextNumber()">Next ▶</button>
    </div>

</div>


<!-- TEST MENU -->
<div id="testMenu" class="screen hidden">

    <button class="homeButton" onclick="goHome()">🏠 Home</button>

    <h1 class="pageTitle">📝 Choose Your Test</h1>

    <div class="testChoices">

        <button class="testChoice alphabetTestButton"
                onclick="startAlphabetTest()">
            🔤
            <strong>Alphabet Test</strong>
            <small>20 Marks</small>
        </button>

        <button class="testChoice numberTestButton"
                onclick="startNumberTest()">
            🔢
            <strong>Numbers Test</strong>
            <small>20 Marks</small>
        </button>

    </div>

</div>


<!-- TEST PAGE -->
<div id="testPage" class="screen hidden">

    <button class="homeButton" onclick="openTestMenu()">⬅ Tests</button>

    <h1 id="testTitle" class="pageTitle">📝 Test</h1>

    <div class="testCard">

        <div class="testInfo">
            Question <span id="questionNumber">1</span> / 20
        </div>

        <div id="testQuestion" class="testQuestion">
            A
        </div>

        <div id="answerArea" class="answerArea"></div>

        <button id="nextQuestionButton"
                class="nextQuestionButton"
                onclick="submitTestAnswer()">
            Submit Answer ➜
        </button>

    </div>

</div>


<!-- RESULT -->
<div id="resultPage" class="screen hidden">

    <div class="resultBox">

        <div class="resultEmoji" id="resultEmoji">🏆</div>

        <h1>🎉 Test Complete! 🎉</h1>

        <div class="scoreCircle">
            <span id="resultPercentage">100%</span>
        </div>

        <h2 id="resultText">Excellent!</h2>

        <p>
            Score:
            <strong id="resultScore">20 / 20</strong>
        </p>

        <div id="danceArea" class="danceArea"></div>

        <button class="resultButton" onclick="openTestMenu()">
            📝 Try Another Test
        </button>

        <button class="resultButton homeResult"
                onclick="goHome()">
            🏠 Home
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
