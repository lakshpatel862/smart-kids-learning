<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Kids Learning</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HOME / ALPHABET BOX SCREEN -->
    <div id="homePage">

        <h1>🌈 Smart Kids Learning</h1>
        <h2>📚 Learn English Alphabets</h2>

        <p class="instruction">
            👆 Click on any alphabet to learn
        </p>

        <div id="alphabetGrid"></div>

    </div>


    <!-- ALPHABET LESSON SCREEN -->
    <div id="lessonPage" class="hidden">

        <button class="homeBtn" onclick="goHome()">
            🏠 Home
        </button>

        <div class="lessonTitle">
            <span id="letter">A</span>
            <span> for </span>
            <span id="word">Apple</span>
        </div>

        <div class="lessonBox">

            <div class="bigLetter" id="bigLetter">
                A
            </div>

            <div class="smallLetter" id="smallLetter">
                a
            </div>

            <div class="picture" id="picture">
                🍎
            </div>

            <h2 id="wordText">
                Apple
            </h2>

        </div>

        <button class="speakBtn" onclick="speakCurrent()">
            🔊 Click to Hear
        </button>

        <div class="navigation">

            <button onclick="previousLetter()">
                ⬅️ Previous
            </button>

            <span id="progress">
                1 / 26
            </span>

            <button onclick="nextLetter()">
                Next ➡️
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
