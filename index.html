<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Magic Alphabet World</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= BACKGROUND ================= -->

    <div class="sky">

        <div class="sun">☀️</div>

        <div class="cloud cloud1">☁️</div>
        <div class="cloud cloud2">☁️</div>
        <div class="cloud cloud3">☁️</div>

        <div class="rainbow">
            🌈
        </div>

        <div class="star star1">⭐</div>
        <div class="star star2">✨</div>
        <div class="star star3">⭐</div>
        <div class="star star4">✨</div>

        <div class="balloon balloon1">🎈</div>
        <div class="balloon balloon2">🎈</div>
        <div class="balloon balloon3">🎈</div>

        <div class="tree tree1">🌳</div>
        <div class="tree tree2">🌳</div>

    </div>


    <!-- ================= HEADER ================= -->

    <header>

        <div class="logoTitle">
            🌈 MAGIC ALPHABET WORLD 🌈
        </div>

        <div class="subtitle">
            🚀 Learn • Play • Discover • Smile 😊
        </div>

        <div class="topInfo">

            <div class="starCounter">
                ⭐ Stars:
                <span id="starCount">0</span>
            </div>

            <div class="progressBox">
                🔤 Learned:
                <span id="learnedCount">0</span>/26
            </div>
