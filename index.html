<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Alphabet World</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HOME -->
    <div id="homePage" class="screen">

        <div class="stars">✨ ⭐ ✨ ⭐ ✨</div>

        <div class="homeContent">

            <div class="kids">👧 🧒 👦</div>

            <h1>🌈 Kids Learning World 🌈</h1>

            <p>Learn • Play • Enjoy</p>

            <!-- ALPHABET BOX -->
            <button class="alphabetHomeBox" onclick="openAlphabetPage()">
                <span class="bigABC">🔤</span>
                <span class="boxTitle">Alphabet</span>
                <span class="boxSub">A to Z</span>
                <span class="clickText">👆 Click to Start</span>
            </button>

        </div>
    </div>


    <!-- ALPHABET PAGE -->
    <div id="alphabetPage" class="screen hidden">

        <button class="homeButton" onclick="goHome()">
            🏠 Home
        </button>

        <div class="alphabetHeader">
            <h1>🔤 Learn Alphabet</h1>
            <p>A to Z • Let's Learn!</p>
        </div>

        <div class="learningArea">

            <!-- LETTER -->
            <div id="letter" class="letter">A</div>

            <!-- WORD + PICTURE -->
            <div class="wordArea">

                <div id="picture" class="picture">🍎</div>

                <div id="word" class="word">
                    Apple
                </div>

            </div>

        </div>

        <div id="sentence" class="sentence">
            A for Apple
        </div>

        <!-- SPEAK -->
        <button class="speakButton" onclick="speakCurrent()">
            🔊 Hear Again
        </button>

        <!-- NEXT / PREVIOUS -->
        <div class="navigation">

            <button id="previousButton" onclick="previousLetter()">
                ◀ Previous
            </button>

            <div id="progress">
                A / Z
            </div>

            <button id="nextButton" onclick="nextLetter()">
                Next ▶
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
