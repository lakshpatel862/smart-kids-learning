<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kids Learning World</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= HOME ================= -->

<div id="homePage" class="screen">

    <div class="clouds">☁️ ☁️ ☁️ ☁️</div>

    <div class="homeContent">

        <div class="kids">👧 🧒 👦</div>

        <h1>🌈 Kids Learning World 🌈</h1>

        <p>Learn • Play • Enjoy</p>


        <!-- ALPHABET -->

        <button class="homeBox alphabetBox"
                onclick="openAlphabetPage()">

            <span class="homeIcon">🔤</span>

            <span class="homeTitle">Alphabet</span>

            <span class="homeSub">A to Z</span>

            <span class="clickText">👆 Click to Start</span>

        </button>


        <!-- NUMBERS -->

        <button class="homeBox numberBox"
                onclick="openNumberPage()">

            <span class="homeIcon">🔢</span>

            <span class="homeTitle">Numbers</span>

            <span class="homeSub">1 to 1000</span>

            <span class="clickText">👆 Click to Start</span>

        </button>


        <!-- TEST -->

        <button class="homeBox testBox"
                onclick="openTestPage()">

            <span class="homeIcon">📝</span>

            <span class="homeTitle">Alphabet Test</span>

            <span class="homeSub">Capital A - Z</span>

            <span class="clickText">👆 Start Test</span>

        </button>

    </div>

</div>


<!-- ================= ALPHABET PAGE ================= -->

<div id="alphabetPage" class="screen hidden">

    <button class="homeButton" onclick="goHome()">
        🏠 Home
    </button>

    <div class="pageHeading">

        <h1>🔤 Learn Alphabet</h1>

        <p>A to Z</p>

    </div>


    <div class="learningArea">

        <div id="letter" class="letter">
            A
        </div>

        <div class="wordArea">

            <div id="picture" class="picture">
                🍎
            </div>

            <div id="word" class="word">
                Apple
            </div>

        </div>

    </div>


    <div id="sentence" class="sentence">
        A for Apple
    </div>


    <button class="speakButton"
            onclick="speakAlphabet()">

        🔊 Hear Again

    </button>


    <div class="navigation">

        <button onclick="previousAlphabet()">
            ◀ Previous
        </button>

        <span id="alphabetProgress">
            A / Z
        </span>

        <button onclick="nextAlphabet()">
            Next ▶
        </button>

    </div>

</div>


<!-- ================= NUMBER PAGE ================= -->

<div id="numberPage" class="screen hidden">

    <button class="homeButton" onclick="goHome()">
        🏠 Home
    </button>

    <div class="pageHeading">

        <h1>🔢 Learn Numbers</h1>

        <p>1 to 1000 • Let's Count!</p>

    </div>


    <div class="numberLearningArea">

        <div id="bigNumber" class="bigNumber">
            1
        </div>

        <div id="balls" class="balls">
            ⚽
        </div>

        <div id="numberName" class="numberName">
            One
        </div>

    </div>


    <button class="speakButton"
            onclick="speakNumber()">

        🔊 Hear Again

    </button>


    <div class="navigation">

        <button onclick="previousNumber()">
            ◀ Previous
        </button>

        <span id="numberProgress">
            1 / 1000
        </span>

        <button onclick="nextNumber()">
            Next ▶
        </button>

    </div>

</div>


<!-- ================= TEST PAGE ================= -->

<div id="testPage" class="screen hidden">

    <button class="homeButton" onclick="goHome()">
        🏠 Home
    </button>


    <div class="pageHeading">

        <h1>📝 Alphabet Test</h1>

        <p>Match CAPITAL letter with small letter</p>

    </div>


    <div class="testInfo">

        Question
        <span id="testQuestionNumber">1</span>

        /

        <span id="testTotalQuestions">26</span>

        &nbsp; | &nbsp;

        Score:
        <span id="testScore">0</span>

    </div>


    <div class="matchingArea">


        <!-- CAPITAL -->

        <div class="capitalSide">

            <div class="testLabel">
                CAPITAL
            </div>

            <div id="capitalLetter"
                 class="match
