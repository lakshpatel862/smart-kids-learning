<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kids Learning World</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Comic Sans MS", "Trebuchet MS", sans-serif;
    background:linear-gradient(135deg,#72dcff,#a88cff,#ff9dca);
    min-height:100vh;
    color:#333;
}

/* =========================
   COMMON
========================= */

.page{
    display:none;
    min-height:100vh;
}

.page.active{
    display:block;
}

button{
    font-family:inherit;
    cursor:pointer;
    border:none;
}

/* =========================
   TOP IMAGE
========================= */

.top-image{
    width:100%;
    text-align:center;
    padding:15px 10px 5px;
}

.top-image img{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:50%;
    border:6px solid white;
    box-shadow:0 8px 25px rgba(0,0,0,0.2);
}

/* =========================
   HOME
========================= */

.home-header{
    text-align:center;
    padding:10px 15px 20px;
}

.home-header h1{
    font-size:42px;
    color:white;
    text-shadow:3px 3px 0 #7c48a8;
}

.home-header p{
    color:white;
    font-size:20px;
    font-weight:bold;
}

.clouds{
    font-size:35px;
    letter-spacing:15px;
    margin:8px 0;
}

/* HERO */

.hero{
    max-width:1100px;
    margin:10px auto 25px;
    padding:30px 20px;
    text-align:center;
    background:rgba(255,255,255,0.30);
    border-radius:30px;
    backdrop-filter:blur(5px);
}

.hero h2{
    font-size:32px;
    color:white;
    text-shadow:2px 2px #7650a8;
}

.hero p{
    margin-top:8px;
    color:#fff;
    font-size:18px;
    font-weight:bold;
}

/* =========================
   FEATURE CARDS
========================= */

.features{
    max-width:1100px;
    margin:auto;
    padding:10px 15px 30px;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.feature-card{
    min-height:180px;
    border-radius:28px;
    padding:25px 15px;
    background:rgba(255,255,255,0.95);
    box-shadow:0 10px 25px rgba(0,0,0,0.18);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    transition:0.25s;
}

.feature-card:hover{
    transform:translateY(-8px) scale(1.02);
    box-shadow:0 15px 30px rgba(0,0,0,0.25);
}

.feature-card:active{
    transform:scale(0.96);
}

.feature-icon{
    font-size:60px;
    margin-bottom:10px;
}

.feature-card h3{
    font-size:22px;
    color:#58348c;
}

.feature-card p{
    font-size:14px;
    margin-top:6px;
    color:#666;
}

/* Different card backgrounds */

.alphabet{
    background:linear-gradient(135deg,#fff5a8,#ffd36b);
}

.numbers{
    background:linear-gradient(135deg,#a9f6ff,#7cc8ff);
}

.animals{
    background:linear-gradient(135deg,#b8ffb0,#72e5a0);
}

.colors{
    background:linear-gradient(135deg,#ffc5f5,#d59cff);
}

.fruits{
    background:linear-gradient(135deg,#fff0a5,#ffb65c);
}

.quiz{
    background:linear-gradient(135deg,#ffb4b4,#ff7d9c);
}

.puzzle{
    background:linear-gradient(135deg,#b9c8ff,#8e9cff);
}

.draw{
    background:linear-gradient(135deg,#ffd3e8,#ff9fc7);
}

.daily{
    background:linear-gradient(135deg,#fff1b7,#ffc45c);
}

/* bottom image */

.bottom-image{
    text-align:center;
    padding:20px;
}

.bottom-image img{
    width:190px;
    height:190px;
    object-fit:cover;
    border-radius:25px;
    border:6px solid white;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* =========================
   ALPHABET PAGE
========================= */

.alphabet-page{
    padding-bottom:40px;
}

.alphabet-header{
    padding:18px 15px;
    text-align:center;
}

.back-btn{
    position:absolute;
    left:15px;
    top:15px;

    background:white;
    color:#673f98;

    padding:10px 18px;
    border-radius:30px;

    font-size:17px;
    font-weight:bold;

    box-shadow:0 5px 15px rgba(0,0,0,0.18);
}

.alphabet-header h1{
    color:white;
    font-size:38px;
    text-shadow:3px 3px #673f98;
}

.alphabet-header p{
    color:white;
    font-size:17px;
    margin-top:5px;
}

/* language */

.language-box{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:15px auto;
}

.lang-btn{
    padding:10px 18px;
    border-radius:25px;
    background:white;
    color:#663d91;
    font-weight:bold;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.lang-btn.active{
    background:#663d91;
    color:white;
}

/* progress */

.progress-box{
    width:min(90%,600px);
    margin:15px auto 25px;
    background:rgba(255,255,255,0.5);
    padding:12px;
    border-radius:20px;
}

.progress-text{
    text-align:center;
    color:white;
    font-weight:bold;
    margin-bottom:7px;
}
