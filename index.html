<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kids Learning World</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- BACKGROUND ROBOT -->
<div class="backgroundRobot">🤖</div>


<!-- =====================================================
                         HOME
===================================================== -->

<section id="homePage" class="page">

    <div class="clouds">☁️ ☁️ ☁️ ☁️</div>

    <div class="homeTopRobot">🤖</div>

    <h1>🌈 Kids Learning World 🌈</h1>

    <p class="subtitle">
        Learn • Play • Enjoy
    </p>


    <div class="menu">


        <!-- ALPHABET -->

        <button id="alphabetBtn"
                class="menuBox alphabet">

            <span>🔤</span>

            <b>Alphabet</b>

            <small>A to Z</small>

            <em>👆 Click to Start</em>

        </button>


        <!-- NUMBERS -->

        <button id="numberBtn"
                class="menuBox numbers">

            <span>🔢</span>

            <b>Numbers</b>

            <small>1 to 1000</small>

            <em>👆 Click to Start</em>

        </button>


        <!-- ANIMALS -->

        <button id="animalBtn"
                class="menuBox animals">

            <span>🐯</span>

            <b>Animals</b>

            <small>Animals & Sounds</small>

            <em>👆 Click to Start</em>

        </button>


        <!-- TEST -->

        <button id="testBtn"
                class="menuBox test">

            <span>📝</span>

            <b>Kids Test</b>

            <small>20 Marks</small>

            <em>👆 Start Test</em>

        </button>

    </div>

</section>



<!-- =====================================================
                       ALPHABET
===================================================== -->

<section id="alphabetPage" class="page hidden">

    <button class="homeBtn">
        🏠 Home
    </button>

    <h2>🔤 Learn Alphabet</h2>

    <div class="alphabetLearning">

        <div id="letter" class="bigLetter">
            A
        </div>


        <div class="wordCard">

            <div id="picture" class="bigEmoji">
                🍎
            </div>

            <div id="word" class="bigWord">
                Apple
            </div>

            <div id="sentence" class="sentence">
                A for Apple
            </div>

        </div>

    </div>


    <button id="speakAlphabetBtn"
            class="actionBtn">

        🔊 Hear Again

    </button>


    <div class="nav">

        <button id="prevAlphabet">
            ◀ Previous
        </button>

        <span id="alphabetProgress">
            A / Z
        </span>

        <button id="nextAlphabet">
            Next ▶
        </button>

    </div>

</section>



<!-- =====================================================
                        NUMBERS
===================================================== -->

<section id="numberPage" class="page hidden">

    <button class="homeBtn">
        🏠 Home
    </button>

    <h2>🔢 Learn Numbers</h2>

    <p class="pageSub">
        1 to 1000 • Let's Count!
    </p>


    <div class="numberCard">

        <div id="bigNumber"
             class="bigNumber">

            1

        </div>


        <div id="balls"
             class="balls">

            ⚽

        </div>


        <div id="numberName"
             class="numberName">

            One

        </div>

    </div>


    <button id="speakNumberBtn"
            class="actionBtn">

        🔊 Hear Again

    </button>


    <div class="nav">
